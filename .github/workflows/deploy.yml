name: Deploy Automático na OCI

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Atualizar código e reiniciar aplicação
        run: |
          cd ~/projeto
          git pull origin main
          sed -i 's/\r$//' scripts/setup_fail2ban.sh
          sed -i 's/\r$//' scripts/fix_nginx_pqc.sh
          chmod +x scripts/setup_fail2ban.sh
          ./scripts/setup_fail2ban.sh
          chmod +x scripts/fix_nginx_pqc.sh
          ./scripts/fix_nginx_pqc.sh
          docker compose up -d --build
