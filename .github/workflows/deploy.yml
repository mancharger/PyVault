name: Deploy Automático na OCI

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Atualizar código e reiniciar aplicação
        run: |
          cd ~/projeto
          git pull origin main
          chmod +x scripts/setup_fail2ban.sh
          ./scripts/setup_fail2ban.sh
          sudo cp nginx/nginx.conf /etc/nginx/nginx.conf
          sudo nginx -t && sudo systemctl reload nginx
          docker compose up -d --build
